[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "image-deconvolution"
version = "0.1.0"
description = "An offline desktop workspace for studying image deconvolution"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.3.3",
    "scipy==1.16.2",
    "Pillow==12.3.0",
    "PySide6-Essentials==6.10.0",
]

[project.optional-dependencies]
build = ["pyinstaller==6.16.0"]
dev = ["ruff"]

[project.gui-scripts]
image-deconvolution = "image_deconvolution.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
image_deconvolution = ["resources/samples/*.tif", "resources/samples/*.json", "resources/samples/*.csv"]

[tool.ruff]
line-length = 120
